[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unimorph-backend-eee"
version = "1.0.2"
description = "UniMorph TSV-lookup backend for the EEE project"
readme = "README.md"
license = "Apache-2.0"
authors = [{name = "Oleg Sadov", email = "oleg.sadov@gmail.com"}]
requires-python = ">=3.12"
dependencies = [
    "tomlkit",
]

[project.urls]
Homepage = "https://github.com/EEE-project/unimorph-backend-eee"
Repository = "https://github.com/EEE-project/unimorph-backend-eee"

[dependency-groups]
dev = [
    "pytest",
    "eee-project @ git+https://codeberg.org/EEE-project/eee-project.git",
]

[project.entry-points."eee_project.backends.v1"]
la = "unimorph_backend_eee:UniMorphBackend"
ru = "unimorph_backend_eee:UniMorphBackend"
es = "unimorph_backend_eee:UniMorphBackend"
tr = "unimorph_backend_eee:UniMorphBackend"

[project.entry-points."eee_project.named_backends.v1"]
unimorph = "unimorph_backend_eee:UniMorphBackend"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/unimorph_backend_eee"]

[tool.pytest.ini_options]
testpaths = ["tests"]

