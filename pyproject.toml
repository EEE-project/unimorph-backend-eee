[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unimorph-backend-eee"
version = "0.4.0"
requires-python = ">=3.12"
dependencies = [
    "eee @ git+https://codeberg.org/EEE-project/eee.git",
    "tomlkit",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.entry-points."eee.backends.v1"]
el = "unimorph_backend_eee:UniMorphBackend"
grc = "unimorph_backend_eee:UniMorphBackend"
la = "unimorph_backend_eee:UniMorphBackend"
ru = "unimorph_backend_eee:UniMorphBackend"
es = "unimorph_backend_eee:UniMorphBackend"
tr = "unimorph_backend_eee:UniMorphBackend"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/unimorph_backend_eee"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
eee = { path = "../eee", editable = true }
